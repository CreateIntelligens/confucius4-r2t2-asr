<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>333-R2T2-ASR｜即時語音辨識字幕</title>
  <meta name="description" content="333-R2T2-ASR 即時語音辨識與字幕工作台，支援麥克風即時收音、長音檔逐段轉寫、OBS 直播透明字幕疊加。技術提供 david888.com。">
  <meta name="keywords" content="ASR, 語音辨識, 即時字幕, OBS 字幕, Confucius4-R2T2, Qwen3-ASR, david888">
  <meta name="author" content="david888.com">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://asr.5gao.ai/">
  <meta property="og:title" content="333-R2T2-ASR｜即時語音辨識字幕">
  <meta property="og:description" content="333-R2T2-ASR 即時語音辨識與字幕工作台，支援麥克風即時收音、長音檔逐段轉寫、OBS 直播透明字幕疊加。技術提供 david888.com。">
  <meta property="og:image" content="https://asr.5gao.ai/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="333-R2T2-ASR">
  <meta property="og:locale" content="zh_TW">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://asr.5gao.ai/">
  <meta name="twitter:title" content="333-R2T2-ASR｜即時語音辨識字幕">
  <meta name="twitter:description" content="支援麥克風即時收音、長音檔逐段轉寫、OBS 直播透明字幕疊加。技術提供 david888.com。">
  <meta name="twitter:image" content="https://asr.5gao.ai/assets/og-image.png">

  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-area">
        <span class="brand-mark">R2T2</span>
        <div class="brand-copy">
          <h1>333-R2T2-ASR</h1>
          <p>即時語音辨識字幕</p>
        </div>
      </div>
      <div class="header-tools">
        <div class="status-pill" aria-live="polite">
          <span class="status-dot" id="ws-dot"></span>
          <span id="ws-status">未連線</span>
        </div>
        <button class="header-button" id="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg>
          <span id="theme-label">深色模式</span>
        </button>
        <button class="header-button" id="obs-toggle" type="button" title="透明字幕疊加給 OBS 瀏覽器來源使用；按 Esc 返回控制台">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 15h10M7 11h6"/></svg>
          <span>OBS 透明字幕</span>
        </button>
      </div>
    </div>
  </header>

  <main class="workspace">

    <div class="workspace-grid">
      <div class="main-column">
        <section class="caption-hero" aria-labelledby="caption-heading">
          <div class="stage-title">
            <div>
              <h3 id="caption-heading">字幕預覽</h3>
              <p>即時收音與音檔分段結果會顯示在這裡</p>
            </div>
            <span class="source-chip" id="source-status">待命</span>
          </div>
          <div class="caption-text" id="caption-box" aria-live="polite" aria-atomic="true">
            <span class="caption-empty">開始收音或選擇音檔，即可查看辨識字幕。</span>
          </div>
          <div class="visualizer-container">
            <canvas id="visualizer" aria-label="麥克風音量波形"></canvas>
          </div>
          <div class="stage-footer">
            <span>ASR 耗時<strong id="asr-cost">—</strong> ms</span>
            <span>總延遲<strong id="total-cost">—</strong> ms</span>
            <span>音訊區塊<strong id="chunk-count">0</strong></span>
          </div>
        </section>

        <section class="control-card" aria-labelledby="source-heading">
          <div class="section-heading">
            <div>
              <h3 id="source-heading">音訊來源</h3>
              <p>選擇即時收音，或上傳音檔逐段辨識。</p>
            </div>
          </div>

          <div class="button-row">
            <button class="btn btn-record" id="record-btn" type="button">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
              <span id="record-text">開始收音</span>
            </button>
            <button class="btn btn-secondary" id="upload-btn" type="button">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M5 14v5h14v-5"/>
              </svg>
              <span>上傳音檔</span>
            </button>
            <input class="file-input" id="audio-file" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg,.aac,.webm" aria-label="選擇要辨識的音訊檔案">
          </div>
          <p class="file-help">支援 WAV、MP3、FLAC、M4A、OGG · 單檔上限 200 MB</p>

          <div class="progress-area" id="upload-progress" hidden>
            <div class="progress-heading">
              <span id="upload-status">準備辨識音檔</span>
              <div class="progress-tools">
                <span id="upload-progress-label">0%</span>
                <button class="cancel-upload-btn" id="cancel-upload-btn" type="button" hidden>停止辨識</button>
              </div>
            </div>
            <div class="progress-track" id="upload-progress-track" role="progressbar" aria-label="音檔辨識進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill" id="upload-progress-fill"></div>
            </div>
            <div class="progress-meta" id="upload-progress-meta">每 30 秒完成一段並更新字幕。</div>
          </div>

          <div class="fields-grid">
            <div class="field">
              <label for="lang-select">辨識語言</label>
              <select class="select" id="lang-select">
                <option value="zhen" selected>自動辨識（中／英）</option>
                <option value="Chinese">中文</option>
                <option value="English">英文</option>
                <option value="Cantonese">粵語</option>
                <option value="Japanese">日語</option>
                <option value="Korean">韓語</option>
                <option value="French">法語</option>
                <option value="German">德語</option>
                <option value="Spanish">西班牙語</option>
              </select>
            </div>
            <div class="field">
              <label for="output-script-select">中文輸出</label>
              <select class="select" id="output-script-select">
                <option value="traditional" selected>繁體中文</option>
                <option value="simplified">簡體中文</option>
              </select>
            </div>
            <div class="field">
              <label for="context-input">熱詞與專有名詞</label>
              <input class="input" id="context-input" type="text" placeholder="例：Confucius4、R2T2、Qwen3">
            </div>
            <div class="field">
              <label for="secret-key">即時串流密鑰</label>
              <input class="input" id="secret-key" type="password" value="test0102">
            </div>
            <div class="field">
              <label for="mic-select">麥克風裝置</label>
              <select class="select" id="mic-select">
                <option value="">預設麥克風</option>
              </select>
            </div>
          </div>
        </section>
      </div>

      <aside class="side-column">
        <section class="history-card" aria-labelledby="history-heading">
          <div class="history-header">
            <div class="history-heading">
              <h3 id="history-heading">字幕紀錄 <span>(<span id="history-count">0</span>)</span></h3>
              <p>音檔字幕以音訊時間排序</p>
            </div>
            <div class="history-actions">
              <button class="history-btn" id="copy-btn" type="button">複製</button>
              <button class="history-btn" id="export-btn" type="button">下載 TXT</button>
              <button class="history-btn" id="clear-btn" type="button">清空</button>
            </div>
          </div>
          <div class="history-list" id="history-list" role="log" aria-label="字幕辨識紀錄"></div>
          <div class="history-empty" id="history-empty">完成的直播句子與音檔片段會保存在這裡。</div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span class="footer-copy">技術提供 <a class="footer-link" href="https://david888.com" target="_blank" rel="noopener noreferrer">david888.com</a></span>
      <span class="footer-sep" aria-hidden="true">|</span>
      <a class="footer-link" href="/llms.txt" target="_blank" rel="noopener noreferrer">llms.txt</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
