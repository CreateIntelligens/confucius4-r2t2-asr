services:
  # 宿主的模型目錄不存在時，Docker 會以 root 建立它，服務以宿主帳號執行就寫不進去，
  # 自動下載會失敗。這裡只把「root 擁有」的掛載點交給宿主帳號；本來就有主人的目錄不動。
  r2t2-init:
    image: nginx:1.27-alpine
    restart: "no"
    user: "0:0"
    environment:
      OWNER: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command:
      - sh
      - -c
      - 'for d in /model /vad /gguf; do [ "$$(stat -c %u $$d)" = 0 ] && chown "$$OWNER" $$d; done; true'
    volumes:
      - ${MODEL_HOST_DIR:-./models/Confucius4-R2T2}:/model
      - ${VAD_HOST_DIR:-./models/FireRedVAD}:/vad
      - ${GGUF_HOST_DIR:-./models/Confucius4-R2T2-GGUF}:/gguf

  r2t2-api:
    depends_on:
      r2t2-init:
        condition: service_completed_successfully
    # build 前先把 wheel 下到 wheels/（見 README），Dockerfile 以 --no-index 讀本機
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_LLAMA: ${WITH_LLAMA:-1}
    image: confucius-r2t2-asr:local
    container_name: r2t2-api
    restart: unless-stopped
    init: true
    environment:
      MODEL_DIR: /model
      MODEL_ID: ${MODEL_ID:-netease-youdao/Confucius4-R2T2}
      VAD_DIR: /vad
      GGUF_DIR: /gguf
      # auto：依序嘗試 vllm → llama → transformers，哪個在這台起得來就用哪個
      ASR_BACKEND: ${ASR_BACKEND:-auto}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-1}
      AUTO_WARMUP: ${AUTO_WARMUP:-1}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.35}
      STREAM_DEFAULT_LANGUAGE: ${STREAM_DEFAULT_LANGUAGE:-zhen}
      STREAM_SECRET_KEYS: ${STREAM_SECRET_KEYS:-test0102}
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      # 統一記憶體機器：避免配置器碎片化後越撐越大
      PYTORCH_ALLOC_CONF: expandable_segments:True
    expose:
      - "8000"
    # 以宿主帳號執行：模型目錄是宿主目錄，避免自動下載後留下 root 檔
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            # CDI 模式，與本機其他 GPU 服務一致：裝置權限由 Docker 依
            # /var/run/cdi/nvidia.yaml 納管，不靠 legacy nvidia runtime hook。
            - driver: cdi
              capabilities: [gpu]
              device_ids:
                - nvidia.com/gpu=all
    volumes:
      # 模型放外面，重建映像不必重新下載（ASR 約 4 GB、VAD 約 2 MB）
      - ${MODEL_HOST_DIR:-./models/Confucius4-R2T2}:/model
      - ${VAD_HOST_DIR:-./models/FireRedVAD}:/vad
      - ${GGUF_HOST_DIR:-./models/Confucius4-R2T2-GGUF}:/gguf
      # 程式與網頁掛工作區的，改了重啟容器即生效，不必重 build
      - ./app:/app:ro
      - ./web:/web:ro
    working_dir: /app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

  r2t2-nginx:
    image: nginx:1.27-alpine
    container_name: r2t2-nginx
    restart: unless-stopped
    depends_on:
      - r2t2-api
    ports:
      - "${PUBLIC_PORT:-8803}:${PUBLIC_PORT:-8803}"
    environment:
      PUBLIC_PORT: ${PUBLIC_PORT:-8803}
      UPSTREAM_HOST: r2t2-api
      UPSTREAM_PORT: 8000
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_PORT|UPSTREAM_HOST|UPSTREAM_PORT)"
    volumes:
      - ./nginx.template:/etc/nginx/templates/default.conf.template:ro
